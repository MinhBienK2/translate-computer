[project]
name = "translate-computer"
version = "1.0.0"
description = "Ứng dụng dịch thuật nhanh - Chọn text và nhấn Alt+E để dịch"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "keyboard==0.13.5",
    "pyperclip==1.8.2",
    "deep-translator==1.11.4",
    "pyttsx3==2.90",
    "requests==2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

